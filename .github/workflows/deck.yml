name: deck

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MARP: npx -y @marp-team/marp-cli@latest --allow-local-files
    steps:
      - uses: actions/checkout@v4

      - name: Export HTML (self-contained with embedded diagrams)
        run: |
          mkdir -p dist
          $MARP hyperdeveloper-advanced.md -o dist/hyperdeveloper-advanced.html
          python3 -c '
          import base64, pathlib, re
          p = pathlib.Path("dist/hyperdeveloper-advanced.html")
          html = p.read_text(encoding="utf-8")
          def inline(m):
              img = pathlib.Path(m.group(0))
              if img.is_file():
                  b64 = base64.b64encode(img.read_bytes()).decode("ascii")
                  return f"data:image/png;base64,{b64}"
              return m.group(0)
          p.write_text(re.sub(r"diagrams/[A-Za-z0-9_.-]+\.png", inline, html), encoding="utf-8")
          '
          cp -R diagrams dist/

      - name: Export PDF
        run: |
          $MARP hyperdeveloper-advanced.md --pdf -o dist/hyperdeveloper-advanced.pdf

      - name: Export PPTX
        run: |
          $MARP hyperdeveloper-advanced.md --pptx -o dist/hyperdeveloper-advanced.pptx

      - name: Zip dist
        run: cd dist && zip -r ../hyperdeveloper-advanced.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdeveloper-advanced
          path: |
            dist/hyperdeveloper-advanced.pdf
            dist/hyperdeveloper-advanced.html
            hyperdeveloper-advanced.zip

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hyperdeveloper-advanced.pdf
            dist/hyperdeveloper-advanced.html
            hyperdeveloper-advanced.zip
